# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Developed a Linux Cluster Monitoring Agent using Bash scripting, PostgreSQL, Docker, and Crontab to automatically collect and store hardware specifications and real-time resource usage across multiple cluster nodes. Designed two core scripts, one to capture static host information at provisioning time and another to record dynamic CPU and memory usage on a scheduled interval, with all data persisted to a PostgreSQL instance running in a Docker container. Enabled Linux administrators to query historical usage data for capacity planning and failure detection across distributed node environments."
  - name: "Online Sales Dataset Analysis and Restock Recommendation System"
    git_url: "/linux_sql"
    description: "Developed a Python and SQL-based analytics workflow for a 50,000+ transaction Online Sales Dataset to uncover insights around seasonal demand patterns, discount effectiveness, return behaviour, and customer segmentation via RFM scoring. Built reusable data-processing workflows using Pandas and trained a Facebook Prophet time-series forecasting model to predict monthly product demand, with dynamic safety buffers derived from each product's historical demand volatility. Delivered a reusable Python inference function enabling per-product restock recommendations for any target month on demand."
  - name: "Databricks Data Pipeline"
    git_url: "/spark"
    description: "Developed scalable ETL and analytics pipelines using PySpark, Apache Spark, Databricks, SQL, and Delta Lake to ingest and transform data from CSV, Parquet, Azure SQL, cloud storage, and external APIs. Implemented a Medallion Architecture with Bronze, Silver, and Gold layers for raw ingestion, data cleansing, validation, enrichment, joins, and business-ready aggregations. Integrated Azure services including ADLS, Azure Data Factory, JDBC, Lakeflow Connect, and Unity Catalog, and built Delta Live Tables pipelines and interactive Databricks dashboards for fraud and stock-market analytics."
  - name: "Home Credit Default Risk Prediction"
    git_url: "/ml_1"
    description: "Developed an end-to-end credit risk application in Databricks using 300,000+ Home Credit loan applications, implementing a Bronze–Silver–Gold medallion architecture for ingestion, preprocessing, feature engineering, and model-ready datasets with Spark, SQL, and Pandas. Built and optimized Logistic Regression, Random Forest, and Gradient Boosting models using Scikit-learn and cross-validation, achieving ~0.76 AUROC and evaluating performance across Gini, KS, AUPRC, F1, and calibration metrics. Created Databricks EDA and model-monitoring dashboards and a Streamlit application for real-time applicant scoring and explainability."
  - name: "Stock Market Deep Learning System"
    git_url: "/ml_2"
    description: "Developed an end-to-end deep learning and backtesting pipeline for US equity return forecasting across 50 stocks from 2005–2025. Built and compared feedforward neural networks, LSTM sequence models, linear regression, and ResNet-18 chart-image models using PyTorch, Scikit-learn, Pandas, and time-series walk-forward validation with strict leakage controls. Engineered technical and market features including returns, implemented reproducible chronological preprocessing, scaling, checkpointing, and inference workflows. Evaluated models using Sharpe ratio, drawdown, turnover, and transaction-cost-adjusted portfolio performance, with the selected feedforward model achieving 52.08% directional accuracy and a 1.17 net Sharpe ratio. Built a realistic backtesting framework with SPY and equal-weight benchmarks, cost sensitivity analysis, and monitoring."

# List of personal or academic projects
