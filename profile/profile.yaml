# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Developed a Linux Cluster Monitoring Agent using Bash scripting, PostgreSQL, Docker, and Crontab to automatically collect and store hardware specifications and real-time resource usage across multiple cluster nodes. Designed two core scripts, one to capture static host information at provisioning time and another to record dynamic CPU and memory usage on a scheduled interval, with all data persisted to a PostgreSQL instance running in a Docker container. Enabled Linux administrators to query historical usage data for capacity planning and failure detection across distributed node environments."
  - name: "Online Sales Dataset Analysis and Restock Recommendation System"
    git_url: "/linux_sql"
    description: "Analyzed a 50,000+ transaction Online Sales Dataset using Pandas to uncover insights around seasonal demand patterns, discount effectiveness, return behaviour, and customer segmentation via RFM scoring. Trained a Facebook Prophet time-series forecasting model to predict monthly product demand, with dynamic safety buffers derived from each product's historical demand volatility. Delivered a reusable Python inference function enabling the team to generate per-product restock recommendations for any target month on demand."

# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
  #project name
  - name: "Codebase RAG Assistant"
    #URL is optional
    git_url: "https://github.com/Yooshley/ue_rag_assistant"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Built a Source-Grounded Codebase Assistant using ChromaDB, Ollama, and a custom RAG pipeline to answer natural language questions about large C++ codebases with strict citation enforcement. Implemented a custom C++ code chunker using sentence transformer embeddings and vector indexing to enable semantically accurate retrieval across complex codebases, exposed via an MCP server interface. Designed the system to ground every response in retrieved source chunks, preventing hallucination and ensuring all answers are traceable back to the original codebase."
  - name: "Domain Intelligence Agent"
    git_url: "https://github.com/Yooshley/domain-intelligence-agent"
    description: "Built a modular Agentic System using Python, FastAPI, and Streamlit to analyze financial data through a shared core architecture of specialized planning, retrieval, analysis, and reporting agents. Designed a domain-agnostic orchestration layer that routes queries through the appropriate pipeline, grounding outputs in real-time public financial data via Yahoo Finance. Delivered an interactive Streamlit interface for querying and reporting across the agent pipeline."

